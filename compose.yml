services:
  qrtrail:
    restart: unless-stopped
    mem_limit: ${TRAIL_MEM_LIMIT:-256m}
    image: lcas.lincoln.ac.uk/mhanheide/qrtrail:sfytrail
    build: 
      context: .
      dockerfile: .devcontainer/Dockerfile
    volumes:
      - .:/app:ro
      - uploads:/app/static/uploads
    ports:
      - "5999:5999"
    environment:
      - TRAIL_ADMIN_ACCESS_TOKEN=${TRAIL_ADMIN_ACCESS_TOKEN}
      - TRAIL_CONFIG=${TRAIL_CONFIG:-config.py}
      - TRAIL_LOG_FILE=/app/static/uploads/qrtrail.log
      - MAPBOX_TOKEN=${MAPBOX_TOKEN}
      - TRAIL_PUBLIC_URL=${TRAIL_PUBLIC_URL:-}

